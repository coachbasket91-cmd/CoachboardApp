<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Coachboard vidéo</title>
<style>
:root{--ink:#10151c;--panel:#1a212b;--edge:#2b3544;--txt:#e8edf3;--mute:#8d9aab;--hot:#ff8a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;position:fixed;inset:0;width:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--ink);color:var(--txt);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--panel)}
.bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar.top{border-bottom:1px solid var(--edge)}.bar.bot{border-top:1px solid var(--edge);flex-direction:column;align-items:stretch;gap:5px;overflow:visible;padding:5px 8px}
.row{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.row button{flex:1 0 auto;padding:6px 9px;min-height:42px;white-space:nowrap}.row .sw{flex:0 0 36px}
button,select,label.btn{touch-action:manipulation;flex:0 0 auto;font:inherit;color:var(--txt);background:#243040;border:1px solid var(--edge);border-radius:8px;padding:8px 11px;min-height:44px;cursor:pointer}
button:hover,label.btn:hover{background:#2e3d52}
button.on{background:var(--hot);border-color:var(--hot);color:#1a1006;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--hot);outline-offset:2px}
#seek{flex:1 0 160px;min-width:160px;accent-color:var(--hot)}
#time{color:var(--mute);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.sep{width:1px;height:26px;background:var(--edge);margin:0 2px}
.sw{flex:0 0 auto;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--edge)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--hot)}
#lw{width:84px;accent-color:var(--hot)}
.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;background:#000;min-height:0}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#v,#c{position:absolute;left:0;top:0}
#c{pointer-events:none}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;max-width:92%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;font-size:14px}
#doneb{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--hot);border-radius:10px;padding:6px 10px;z-index:7;max-width:94%}#doneb[hidden],#seqp[hidden]{display:none}
#seqp{position:absolute;right:8px;top:8px;bottom:8px;width:min(330px,92%);background:var(--panel);border:1px solid var(--edge);border-radius:10px;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--edge)}#sl{overflow-y:auto;padding:6px}
.si{display:grid;gap:6px;padding:8px;border:1px solid var(--edge);border-radius:8px;margin-bottom:6px}.si .r{display:flex;gap:6px}.si button{flex:1;min-height:40px;padding:4px 8px}.si .m{color:var(--mute);font-size:13px}
#osd{position:absolute;bottom:8px;z-index:5;padding:6px 12px 10px;border-radius:12px;background:#0009;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .25s}
#osd.hid{opacity:0;pointer-events:none}
#osdt{position:absolute;top:8px;left:8px;z-index:8;min-height:40px;opacity:.9}
.pop{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:96%}.pop[hidden]{display:none}
.pop input{width:64px;min-height:44px;background:#243040;color:var(--txt);border:1px solid var(--edge);border-radius:8px;padding:6px;font:inherit;text-align:center}
#trk{position:relative;height:38px;touch-action:none;cursor:pointer}
#trk .ln{position:absolute;left:0;right:0;top:16px;height:6px;border-radius:3px;background:#ffffff4d}
#tfill{position:absolute;left:0;top:16px;height:6px;border-radius:3px;background:var(--hot);width:0;pointer-events:none}
#tmk{position:absolute;inset:0;pointer-events:none}.band{position:absolute;top:11px;height:16px;border-radius:3px}.mkt{position:absolute;top:8px;width:4px;height:22px;border-radius:2px;margin-left:-2px}
#tth{position:absolute;top:10px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--hot);pointer-events:none}
#tip{position:absolute;bottom:42px;transform:translateX(-50%);background:#000d;color:#fff;padding:3px 8px;border-radius:6px;font-size:13px;white-space:nowrap;display:none;pointer-events:none}
#tt{display:flex;justify-content:space-between;align-items:center;color:#fff;font-variant-numeric:tabular-nums}#tt button{min-height:36px;padding:4px 10px;background:#ffffff1f}
#orow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}#orow button,#orow select{min-height:44px;padding:6px 10px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--mute);padding:20px;pointer-events:none}
#empty b{color:var(--txt);font-size:20px}
input[type=file]{display:none}
.hint{color:var(--mute);font-size:12px;margin-left:auto}
label.btn.on{background:var(--hot);border-color:var(--hot);color:#1a1006;font-weight:600}
#pname{flex:0 0 auto;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:13px}
#fmenu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px;display:grid;gap:4px;min-width:210px}#fmenu[hidden],#modal[hidden]{display:none}#fmenu button{text-align:left}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30}
.mb{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px;width:min(380px,92%);display:grid;gap:12px}#mbtn{display:flex;gap:8px;flex-wrap:wrap}#mbtn button{flex:1}
</style></head><body>
<div id="app">
 <div class="bar top">
  <button id="fbtn">Fichier ▾</button><span id="pname"></span>
  <label class="btn" id="vlab">Ouvrir une vidéo<input id="file" type="file" accept="video/*"></label>
  <button id="ba">Début</button><button id="bb">Fin</button><button id="bl">Boucle</button><button id="sadd" title="Enregistrer Début→Fin comme séquence">+ Séquence</button><button id="slist">Séquences</button><button id="fs">Plein écran</button>
 </div>
 <div id="vp"><div id="stage"><video id="v" playsinline webkit-playsinline preload="auto"></video><canvas id="c"></canvas></div>
  <button id="osdt" title="Afficher / masquer la barre de navigation (H)">▾ Barre</button>
  <div id="osd">
   <div id="gt" class="pop" hidden><b>Aller à</b><input id="gh" type="number" inputmode="numeric" min="0" placeholder="h" aria-label="Heures"><input id="gm" type="number" inputmode="numeric" min="0" placeholder="min" aria-label="Minutes"><input id="gs" type="number" inputmode="numeric" min="0" placeholder="s" aria-label="Secondes"><button id="gb">Aller</button><button id="gx">✕</button></div>
   <div id="mkm" class="pop" hidden></div>
   <div id="trk"><div class="ln"></div><div id="tfill"></div><div id="tmk"></div><div id="tth"></div><div id="tip"></div></div>
   <div id="tt"><button id="tcur" title="Toucher pour aller à un instant précis">0:00.0</button><span id="ttot">0:00</span></div>
   <div id="orow"><button id="m30" title="−30 s (Maj+←)">−30 s</button><button id="m10" title="−10 s (J)">−10 s</button><button id="prev" title="Image précédente (←)">◀ 1 img</button><button id="play" title="Lecture / pause (espace, K)">Lecture</button><button id="next" title="Image suivante (→)">1 img ▶</button><button id="p10" title="+10 s (L)">+10 s</button><button id="p30" title="+30 s (Maj+→)">+30 s</button>
    <select id="spd" aria-label="Vitesse"><option value=".25">×0,25</option><option value=".5">×0,5</option><option value="1" selected>×1</option><option value="2">×2</option></select>
    <button id="mkp" title="Repère précédent">⚑◀</button><button id="mk" title="Poser un repère (M)">⚑ Repère</button><button id="mkn" title="Repère suivant">▶⚑</button></div>
  </div>
  <div id="toast"></div><div id="doneb" hidden><span id="donet"></span><button id="dsave">Partager / Enregistrer</button><button id="dx">✕</button></div>
  <div id="seqp" hidden><div class="ph"><b>Séquences et repères</b><button id="sall">Tout exporter</button><button id="sx">✕</button></div><div id="sl"></div></div><div id="empty"><b>Ouvrez votre vidéo panoramique</b><span>Puis zoomez, dessinez, placez des pions et exportez une image.</span></div></div>
 <div class="bar bot" id="tools"></div>
</div>
<div id="fmenu" hidden><button data-f="new">Nouveau</button><button data-f="open">Ouvrir un projet…</button><button data-f="save">Enregistrer</button><button data-f="saveas">Enregistrer sous…</button></div>
<input id="pfile" type="file" accept=".json,.coachboard,application/json">
<div id="modal" hidden><div class="mb"><div id="mmsg"></div><div id="mbtn"></div></div></div>
<script>
const $=i=>document.getElementById(i),v=$('v'),c=$('c'),vp=$('vp'),st=$('stage');let x=c.getContext('2d'),rt=null;const ct=()=>rt!=null?rt:v.currentTime;
let tap0=null,lastTap=null,fingerPan=false,vw=0,vh=0,sc=1,minSc=1,tx=0,ty=0,tool='hand',color='#ffd400',lw=5,shapes=[],cur=null,pan=null,last=null,la=null,lb=null,loop=false;
const cnt={A:0,B:0},ptrs=new Map(),fps=30;
const TOOLS=[['hand','Main'],['zone','Zoom'],['pen','Crayon'],['line','Ligne'],['arrow','Flèche'],['pass','Passe'],['shot','Tir'],['dribble','Dribble'],['screen','Écran'],['circle','Cercle'],['rect','Rect.'],['pawnA','Pion A'],['pawnB','Pion B'],['text','Texte']];
const COLORS=['#ffd400','#ff3b30','#2f7bff','#34c759','#ffffff','#000000'];
const tb=$('tools');
const r1=document.createElement('div'),r2=document.createElement('div');r1.className=r2.className='row';tb.append(r1,r2);
const TIPS={pass:'Passe : flèche en tirets',shot:'Tir : double trait avec flèche',dribble:'Dribble : flèche en zigzag (courbe possible)',screen:'Pose d’écran : trait terminé par une barre',arrow:'Flèche (tracez une courbe pour la courber)',zone:'Zoomer sur une zone'};
TOOLS.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.title=TIPS[k]||l;b.dataset.t=k;b.onclick=()=>setTool(k);r1.appendChild(b)});
COLORS.forEach(k=>{const b=document.createElement('button');b.className='sw';b.style.background=k;b.setAttribute('aria-label','Couleur '+k);b.dataset.c=k;b.onclick=()=>setColor(k);r2.appendChild(b)});
r2.insertAdjacentHTML('beforeend','<input id="lw" type="range" min="2" max="14" value="5" aria-label="Épaisseur"><button id="undo">Annuler</button><button id="clr">Effacer tout</button><button id="tgl" title="Afficher / masquer les dessins">Masquer dessins</button><button id="auto" title="Les dessins s’ancrent sur le joueur et le suivent">Suivi auto</button><button id="run" title="Lancer le suivi des dessins tracés sur cette image">Suivre ▶</button><button id="fit">Recentrer</button><button id="fp" title="Le doigt déplace l’image, le stylet dessine">Doigt = déplacer</button><button id="snap">Exporter</button>');
function setTool(k){tool=k;[...tb.querySelectorAll('[data-t]')].forEach(b=>b.classList.toggle('on',b.dataset.t===k))}
function setColor(k){color=k;[...tb.querySelectorAll('[data-c]')].forEach(b=>b.classList.toggle('on',b.dataset.c===k))}
setTool('hand');setColor(color);
$('lw').oninput=e=>lw=+e.target.value;
function apply(){st.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;layoutOsd()}
function fit(){if(!vw)return;const r=vp.getBoundingClientRect();sc=minSc=Math.min(r.width/vw,r.height/vh);tx=(r.width-vw*sc)/2;ty=(r.height-vh*sc)/2;apply()}
function zoomAt(cx,cy,f){const r=vp.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,ns=Math.min(Math.max(sc*f,minSc*.9),minSc*40);f=ns/sc;tx=px-(px-tx)*f;ty=py-(py-ty)*f;sc=ns;apply()}
function pos(e){const r=vp.getBoundingClientRect();return{x:(e.clientX-r.left-tx)/sc,y:(e.clientY-r.top-ty)/sc}}
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(exporting){toast('Export en cours : patientez.');return}
 if(pendProj){const m=pendProj.video;if(m&&(m.name!==f.name||m.size!==f.size)&&!confirm('Cette vidéo ne correspond pas à celle du projet ('+m.name+'). Continuer quand même ?'))return}
 else if(vw&&dirty&&!await confirmDiscard())return;
 vidMeta={name:f.name,size:f.size};curKey='cbseq:'+f.name+'|'+f.size;v.src=URL.createObjectURL(f);$('empty').style.display='none';$('vlab').classList.remove('on')};
v.onloadedmetadata=()=>{vw=v.videoWidth;vh=v.videoHeight;c.width=vw;c.height=vh;for(const el of[st,v,c]){el.style.width=vw+'px';el.style.height=vh+'px'}shapes=[];fit();draw();loadSeq();loadMk();if(pendProj){const p=pendProj;pendProj=null;applyProj(p)}else fresh();renderTrack();resumePos()};
window.onresize=fit;
const fmt=t=>{t=t||0;const h=Math.floor(t/3600),m=Math.floor(t%3600/60),q=Math.floor(t%60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(q).padStart(2,'0')};
function tick(){if(vw){if(v.currentTime!==lastT&&shapes.some(q=>q.tk)){lastT=v.currentTime;draw()}updTrack();if(pendT!=null&&!v.seeking){v.currentTime=pendT;if(!scrub)pendT=null}if(!v.paused&&performance.now()-lastSave>3000){lastSave=performance.now();savePos()}if(loop&&la!=null&&lb!=null&&lb>la&&v.currentTime>=lb)v.currentTime=la}requestAnimationFrame(tick)}tick();
$('play').onclick=()=>v.paused?v.play():v.pause();
v.onplay=()=>{$('play').textContent='Pause';showOsd()};
v.onpause=()=>{$('play').textContent='Lecture';showOsd();savePos()};
let showDraw=true;function setShow(b){showDraw=b;c.style.visibility=b?'visible':'hidden';$('tgl').textContent=b?'Masquer dessins':'Afficher dessins';$('tgl').classList.toggle('on',!b)}
$('tgl').onclick=()=>setShow(!showDraw);
$('spd').onchange=e=>v.playbackRate=+e.target.value;
const step=d=>{v.pause();v.currentTime=Math.max(0,v.currentTime+d/fps)};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('ba').onclick=()=>{la=v.currentTime;$('ba').classList.add('on');$('ba').textContent='Début '+fmt(la);renderTrack();markDirty()};
$('bb').onclick=()=>{lb=v.currentTime;$('bb').classList.add('on');$('bb').textContent='Fin '+fmt(lb);renderTrack();markDirty()};
$('bl').onclick=()=>{loop=!loop;$('bl').classList.toggle('on',loop);if(loop&&la!=null){v.currentTime=la;v.play()}};
$('undo').onclick=()=>{if(!tracking){shapes.pop();draw();markDirty()}};
$('clr').onclick=()=>{if(tracking)return;if(!shapes.length||confirm('Effacer tous les dessins ?')){shapes=[];cnt.A=cnt.B=0;draw();markDirty()}};
$('fit').onclick=fit;$('fp').onclick=e=>{fingerPan=!fingerPan;e.currentTarget.classList.toggle('on',fingerPan)};
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key;
 if(e.ctrlKey||e.metaKey){const kk=k.toLowerCase();if(kk==='s'){e.preventDefault();saveProject(e.shiftKey);return}if(kk==='o'){e.preventDefault();openProject();return}}
 if(e.code==='Space'||k==='k'||k==='K'){e.preventDefault();$('play').click()}
 else if(k==='ArrowLeft')e.shiftKey?jumpBy(-30,true):step(-1);else if(k==='ArrowRight')e.shiftKey?jumpBy(30,true):step(1);
 else if(k==='j'||k==='J')jumpBy(-10,true);else if(k==='l'||k==='L')jumpBy(10,true);
 else if(k==='m'||k==='M')addMark('Autre');else if(k==='f'||k==='F')$('fs').click();else if(k==='h'||k==='H')$('osdt').click();
 else if((e.ctrlKey||e.metaKey)&&k==='z')$('undo').click();showOsd()});
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.18:1/1.18)},{passive:false});
function pinchInit(){const[a,b]=[...ptrs.values()];last={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}}
vp.onpointerdown=e=>{if(!vw)return;vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 tap0=ptrs.size===1?{x:e.clientX,y:e.clientY,t:performance.now()}:null;
 if(ptrs.size>1){cur=null;pan=null;pinchInit();draw();return}
 const p=pos(e);
 if(tool==='hand'||(fingerPan&&e.pointerType==='touch')){pan={x:e.clientX,y:e.clientY};return}
 if(tracking){toast('Suivi en cours : patientez ou touchez « Arrêter ».');return}
 if(!v.paused)v.pause();if(!showDraw)setShow(true);
 if(tool==='pawnA'||tool==='pawnB'){const k=tool.slice(4);cnt[k]=cnt[k]%10+1;addShape({t:'pawn',a:p,k,n:cnt[k],r:34/sc});draw();return}
 if(tool==='text'){const s=prompt('Texte à écrire');if(s)addShape({t:'text',a:p,s,c:color,w:(lw*4+12)/sc});draw();return}
 cur={t:tool,a:p,b:p,pts:[p],c:color,w:lw*1.4/sc};if(CURVED.includes(tool))fitCurve(cur);draw()};
vp.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size>1){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  if(last){zoomAt(cx,cy,d/last.d);tx+=cx-last.cx;ty+=cy-last.cy;apply()}last={d,cx,cy};return}
 if(pan){tx+=e.clientX-pan.x;ty+=e.clientY-pan.y;pan={x:e.clientX,y:e.clientY};apply();return}
 if(cur){const p=pos(e);cur.b=p;if(cur.t==='pen'||CURVED.includes(cur.t)){cur.pts.push(p);if(CURVED.includes(cur.t))fitCurve(cur)}draw()}};
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)last=null;pan=null;
 const tp=tap0;tap0=null;
 if(tp&&tool==='hand'&&ptrs.size===0&&e.type==='pointerup'&&Math.hypot(e.clientX-tp.x,e.clientY-tp.y)<12&&performance.now()-tp.t<300){const now=performance.now();
  if(lastTap&&now-lastTap.t<380&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<60){lastTap=null;const r=vp.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;
   if(fx<.38)jumpBy(-10,true);else if(fx>.62)jumpBy(10,true);else $('play').click()}else lastTap={x:e.clientX,y:e.clientY,t:now}}
 if(cur){const s=cur;cur=null;const d=Math.hypot(s.b.x-s.a.x,s.b.y-s.a.y)*sc;
  if(s.t==='zone'){const w=Math.abs(s.b.x-s.a.x),h=Math.abs(s.b.y-s.a.y);
   if(w*sc>18&&h*sc>18){const r=vp.getBoundingClientRect();sc=Math.min(r.width/w,r.height/h);tx=(r.width-w*sc)/2-Math.min(s.a.x,s.b.x)*sc;ty=(r.height-h*sc)/2-Math.min(s.a.y,s.b.y)*sc;apply()}setTool('hand')}
  else if(s.t==='pen'?s.pts.length>2:d>4)addShape(s)}
 draw()}
vp.onpointerup=endPtr;vp.onpointercancel=endPtr;
const CURVED=['arrow','pass','shot','dribble','screen'];
let autoOn=false,tracking=false,stopReq=false,lastT=-1,tt;
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,5000)}

 let m=a;for(let i=1;i<P.length;i++)if(cum[i]>=L/2){const t=(L/2-cum[i-1])/((cum[i]-cum[i-1])||1);m={x:P[i-1].x+(P[i].x-P[i-1].x)*t,y:P[i-1].y+(P[i].y-P[i-1].y)*t};break}

function curved(s){const G=animGeom(s);if(!G)return;
 const bz=t=>{const u=1-t;return{x:u*u*G.a.x+2*u*t*G.c.x+t*t*G.b.x,y:u*u*G.a.y+2*u*t*G.c.y+t*t*G.b.y}};
 const P=[];for(let i=0;i<=120;i++)P.push(bz(i/120));
 const cum=[0];for(let i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
 const tot=cum[cum.length-1],shot=s.t==='shot',dr=s.t==='dribble',scr=s.t==='screen',off=s.w*1.15,h=scr?0:Math.min(s.w*(shot?7:dr?6:5),tot*.9);
 const at=d=>{d=Math.max(0,Math.min(tot,d));let i=1;while(i<cum.length-1&&cum[i]<d)i++;const t=(d-cum[i-1])/((cum[i]-cum[i-1])||1),p=P[i-1],q=P[i],l=Math.hypot(q.x-p.x,q.y-p.y)||1;return{x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,nx:-(q.y-p.y)/l,ny:(q.x-p.x)/l}};
 const sb=tot-h,base=at(sb);x.lineWidth=shot?s.w*.8:s.w;
 if(dr){const amp=s.w*1.7,step=s.w*3,V=[];for(let k=0;;k++){const d=sb-k*step;if(d<=0)break;const p=at(d),sg=k?(k%2?1:-1):0;V.push({x:p.x+p.nx*amp*sg,y:p.y+p.ny*amp*sg})}
  V.push(at(0));V.reverse();x.beginPath();V.forEach((p,k)=>k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}
 else{const Q=[];for(let i=0;i<P.length;i++)if(cum[i]<sb)Q.push(P[i]);Q.push(base);
  if(shot){for(const sg of[-1,1]){x.beginPath();Q.forEach((p,k)=>{const n=Q[Math.min(k+1,Q.length-1)],o=Q[Math.max(k-1,0)],tx=n.x-o.x,ty=n.y-o.y,l=Math.hypot(tx,ty)||1,px=p.x-ty/l*off*sg,py=p.y+tx/l*off*sg;k?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}}
  else{if(s.t==='pass')x.setLineDash([s.w*2.4,s.w*2]);x.beginPath();Q.forEach((p,k)=>k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();x.setLineDash([])}}
 if(scr){const p0=P[P.length-3]||P[0],tx_=G.b.x-p0.x,ty_=G.b.y-p0.y,l=Math.hypot(tx_,ty_)||1,bl=s.w*4.6,nx=-ty_/l*bl,ny=tx_/l*bl;x.lineWidth=s.w*1.5;x.beginPath();x.moveTo(G.b.x+nx,G.b.y+ny);x.lineTo(G.b.x-nx,G.b.y-ny);x.stroke();return}
 const dx=G.b.x-base.x,dy=G.b.y-base.y,l=Math.hypot(dx,dy)||1,hw=shot?Math.max(off*2.8,h*.42):h*.5,nx=-dy/l*hw,ny=dx/l*hw;

function paint0(s){x.lineCap=x.lineJoin='round';x.strokeStyle=x.fillStyle=s.c;x.lineWidth=s.w;x.setLineDash([]);x.beginPath();
 switch(s.t){
 case'pen':s.pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();break;
 case'line':x.moveTo(s.a.x,s.a.y);x.lineTo(s.b.x,s.b.y);x.stroke();break;
 case'arrow':case'pass':case'shot':case'dribble':case'screen':curved(s);break;
 case'circle':x.arc(s.a.x,s.a.y,Math.hypot(s.b.x-s.a.x,s.b.y-s.a.y),0,7);x.stroke();break;
 case'rect':x.strokeRect(s.a.x,s.a.y,s.b.x-s.a.x,s.b.y-s.a.y);break;
 case'zone':x.strokeStyle='#fff';x.setLineDash([s.w*3,s.w*2]);x.lineWidth=2/sc;x.strokeRect(s.a.x,s.a.y,s.b.x-s.a.x,s.b.y-s.a.y);break;
 case'pawn':x.fillStyle=s.k==='A'?'#2f7bff':'#15181d';x.arc(s.a.x,s.a.y,s.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=s.r*.12;x.stroke();
  x.fillStyle='#fff';x.font=`700 ${s.r*1.1}px system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(s.n,s.a.x,s.a.y+s.r*.04);break;
 case'text':x.font=`700 ${s.w}px system-ui,sans-serif`;x.textAlign='left';x.textBaseline='middle';x.lineWidth=s.w/6;x.strokeStyle='#000';x.strokeText(s.s,s.a.x,s.a.y);x.fillText(s.s,s.a.x,s.a.y)}}
