<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Coachboard">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Coachboard vidéo</title>
<style>
:root{--ink:#10151c;--panel:#1a212b;--edge:#2b3544;--txt:#e8edf3;--mute:#8d9aab;--hot:#ff8a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;position:fixed;inset:0;width:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--ink);color:var(--txt);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--panel)}
.bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar.top{border-bottom:1px solid var(--edge)}.bar.bot{border-top:1px solid var(--edge);flex-direction:column;align-items:stretch;gap:5px;overflow:visible;padding:5px 8px}
.row{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.row button{flex:1 0 auto;padding:6px 9px;min-height:42px;white-space:nowrap}.row .sw{flex:0 0 36px}
button,select,label.btn{touch-action:manipulation;flex:0 0 auto;font:inherit;color:var(--txt);background:#243040;border:1px solid var(--edge);border-radius:8px;padding:8px 11px;min-height:44px;cursor:pointer}
button:hover,label.btn:hover{background:#2e3d52}
button.on{background:var(--hot);border-color:var(--hot);color:#1a1006;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--hot);outline-offset:2px}
#seek{flex:1 0 160px;min-width:160px;accent-color:var(--hot)}
#time{color:var(--mute);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.sep{width:1px;height:26px;background:var(--edge);margin:0 2px}
.sw{flex:0 0 auto;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--edge)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--hot)}
#lw{width:84px;accent-color:var(--hot)}
.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;background:#000;min-height:0}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#v,#c{position:absolute;left:0;top:0}
#c{pointer-events:none}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;max-width:92%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;font-size:14px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--mute);padding:20px;pointer-events:none}
#empty b{color:var(--txt);font-size:20px}
input[type=file]{display:none}
.hint{color:var(--mute);font-size:12px;margin-left:auto}
</style></head><body>
<div id="app">
 <div class="bar top">
  <label class="btn">Ouvrir une vidéo<input id="file" type="file" accept="video/*"></label>
  <button id="prev" title="Image précédente (←)">◀ 1 img</button>
  <button id="play" title="Lecture / pause (espace)">Lecture</button>
  <button id="next" title="Image suivante (→)">1 img ▶</button>
  <select id="spd" aria-label="Vitesse"><option value=".25">×0,25</option><option value=".5">×0,5</option><option value="1" selected>×1</option><option value="2">×2</option></select>
  <button id="ba">Début boucle</button><button id="bb">Fin boucle</button><button id="bl">Boucle</button>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Position">
  <span id="time">0:00 / 0:00</span>
 </div>
 <div id="vp"><div id="stage"><video id="v" playsinline webkit-playsinline preload="auto"></video><canvas id="c"></canvas></div>
  <div id="toast"></div><div id="empty"><b>Ouvrez votre vidéo panoramique</b><span>Puis zoomez, dessinez, placez des pions et exportez une image.</span></div></div>
 <div class="bar bot" id="tools"></div>
</div>
<script>
const $=i=>document.getElementById(i),v=$('v'),c=$('c'),x=c.getContext('2d'),vp=$('vp'),st=$('stage');
let fingerPan=false,vw=0,vh=0,sc=1,minSc=1,tx=0,ty=0,tool='hand',color='#ffd400',lw=5,shapes=[],cur=null,pan=null,last=null,la=null,lb=null,loop=false;
const cnt={A:0,B:0},ptrs=new Map(),fps=30;
const TOOLS=[['hand','Main'],['zone','Zoom'],['pen','Crayon'],['line','Ligne'],['arrow','Flèche'],['pass','Passe'],['shot','Tir'],['dribble','Dribble'],['circle','Cercle'],['rect','Rect.'],['pawnA','Pion A'],['pawnB','Pion B'],['text','Texte']];
const COLORS=['#ffd400','#ff3b30','#2f7bff','#34c759','#ffffff','#000000'];
const tb=$('tools');
const r1=document.createElement('div'),r2=document.createElement('div');r1.className=r2.className='row';tb.append(r1,r2);
const TIPS={pass:'Passe : flèche en tirets',shot:'Tir : double trait avec flèche',dribble:'Dribble : flèche en zigzag (courbe possible)',arrow:'Flèche (tracez une courbe pour la courber)',zone:'Zoomer sur une zone'};
TOOLS.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.title=TIPS[k]||l;b.dataset.t=k;b.onclick=()=>setTool(k);r1.appendChild(b)});
COLORS.forEach(k=>{const b=document.createElement('button');b.className='sw';b.style.background=k;b.setAttribute('aria-label','Couleur '+k);b.dataset.c=k;b.onclick=()=>setColor(k);r2.appendChild(b)});
r2.insertAdjacentHTML('beforeend','<input id="lw" type="range" min="2" max="14" value="5" aria-label="Épaisseur"><button id="undo">Annuler</button><button id="clr">Effacer tout</button><button id="tgl" title="Afficher / masquer les dessins">Masquer dessins</button><button id="anim" title="Les flèches suivent le mouvement du joueur">Suivi mvt</button><button id="endf" title="Fixer l’arrivée du dernier suivi à l’image affichée">Fin du suivi</button><button id="fit">Recentrer</button><button id="fp" title="Le doigt déplace l’image, le stylet dessine">Doigt = déplacer</button><button id="snap">Exporter</button>');
function setTool(k){tool=k;[...tb.querySelectorAll('[data-t]')].forEach(b=>b.classList.toggle('on',b.dataset.t===k))}
function setColor(k){color=k;[...tb.querySelectorAll('[data-c]')].forEach(b=>b.classList.toggle('on',b.dataset.c===k))}
setTool('hand');setColor(color);
$('lw').oninput=e=>lw=+e.target.value;
function apply(){st.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}
function fit(){if(!vw)return;const r=vp.getBoundingClientRect();sc=minSc=Math.min(r.width/vw,r.height/vh);tx=(r.width-vw*sc)/2;ty=(r.height-vh*sc)/2;apply()}
function zoomAt(cx,cy,f){const r=vp.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,ns=Math.min(Math.max(sc*f,minSc*.9),minSc*40);f=ns/sc;tx=px-(px-tx)*f;ty=py-(py-ty)*f;sc=ns;apply()}
function pos(e){const r=vp.getBoundingClientRect();return{x:(e.clientX-r.left-tx)/sc,y:(e.clientY-r.top-ty)/sc}}
$('file').onchange=e=>{const f=e.target.files[0];if(f){v.src=URL.createObjectURL(f);$('empty').style.display='none'}};
v.onloadedmetadata=()=>{vw=v.videoWidth;vh=v.videoHeight;c.width=vw;c.height=vh;for(const el of[st,v,c]){el.style.width=vw+'px';el.style.height=vh+'px'}shapes=[];$('seek').max=v.duration;fit();draw()};
window.onresize=fit;
const fmt=t=>{t=t||0;return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
function tick(){if(vw){if(v.currentTime!==lastT&&shapes.some(q=>q.anim)){lastT=v.currentTime;draw()}$('seek').value=v.currentTime;$('time').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);if(loop&&la!=null&&lb!=null&&lb>la&&v.currentTime>=lb)v.currentTime=la}requestAnimationFrame(tick)}tick();
$('seek').oninput=e=>v.currentTime=+e.target.value;
$('play').onclick=()=>v.paused?v.play():v.pause();
v.onplay=()=>{$('play').textContent='Pause'};
v.onpause=()=>{$('play').textContent='Lecture'};
let showDraw=true;function setShow(b){showDraw=b;c.style.visibility=b?'visible':'hidden';$('tgl').textContent=b?'Masquer dessins':'Afficher dessins';$('tgl').classList.toggle('on',!b)}
$('tgl').onclick=()=>setShow(!showDraw);
$('spd').onchange=e=>v.playbackRate=+e.target.value;
const step=d=>{v.pause();v.currentTime=Math.max(0,v.currentTime+d/fps)};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('ba').onclick=()=>{la=v.currentTime;$('ba').classList.add('on')};
$('bb').onclick=()=>{lb=v.currentTime;$('bb').classList.add('on')};
$('bl').onclick=()=>{loop=!loop;$('bl').classList.toggle('on',loop);if(loop&&la!=null){v.currentTime=la;v.play()}};
$('undo').onclick=()=>{shapes.pop();draw()};
$('clr').onclick=()=>{if(!shapes.length||confirm('Effacer tous les dessins ?')){shapes=[];cnt.A=cnt.B=0;draw()}};
$('fit').onclick=fit;$('fp').onclick=e=>{fingerPan=!fingerPan;e.currentTarget.classList.toggle('on',fingerPan)};
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
 if(e.code==='Space'){e.preventDefault();$('play').click()}
 else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);
 else if((e.ctrlKey||e.metaKey)&&e.key==='z')$('undo').click()});
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.18:1/1.18)},{passive:false});
function pinchInit(){const[a,b]=[...ptrs.values()];last={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}}
vp.onpointerdown=e=>{if(!vw)return;vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size>1){cur=null;pan=null;pinchInit();draw();return}
 const p=pos(e);
 if(tool==='hand'||(fingerPan&&e.pointerType==='touch')){pan={x:e.clientX,y:e.clientY};return}
 if(!v.paused)v.pause();if(!showDraw)setShow(true);
 if(tool==='pawnA'||tool==='pawnB'){const k=tool.slice(4);cnt[k]=cnt[k]%10+1;shapes.push({t:'pawn',a:p,k,n:cnt[k],r:34/sc});draw();return}
 if(tool==='text'){const s=prompt('Texte à écrire');if(s)shapes.push({t:'text',a:p,s,c:color,w:(lw*4+12)/sc});draw();return}
 cur={t:tool,a:p,b:p,pts:[p],c:color,w:lw*1.4/sc};if(CURVED.includes(tool)){fitCurve(cur);if(animOn){cur.anim=true;cur.t0=v.currentTime}}draw()};
vp.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size>1){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  if(last){zoomAt(cx,cy,d/last.d);tx+=cx-last.cx;ty+=cy-last.cy;apply()}last={d,cx,cy};return}
 if(pan){tx+=e.clientX-pan.x;ty+=e.clientY-pan.y;pan={x:e.clientX,y:e.clientY};apply();return}
 if(cur){const p=pos(e);cur.b=p;if(cur.t==='pen'||CURVED.includes(cur.t)){cur.pts.push(p);if(cur.t!=='pen')fitCurve(cur)}draw()}};
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)last=null;pan=null;
 if(cur){const s=cur;cur=null;const d=Math.hypot(s.b.x-s.a.x,s.b.y-s.a.y)*sc;
  if(s.t==='zone'){const w=Math.abs(s.b.x-s.a.x),h=Math.abs(s.b.y-s.a.y);
   if(w*sc>18&&h*sc>18){const r=vp.getBoundingClientRect();sc=Math.min(r.width/w,r.height/h);tx=(r.width-w*sc)/2-Math.min(s.a.x,s.b.x)*sc;ty=(r.height-h*sc)/2-Math.min(s.a.y,s.b.y)*sc;apply()}setTool('hand')}
  else if(s.t==='pen'?s.pts.length>2:d>4)shapes.push(s)}
 draw()}
vp.onpointerup=endPtr;vp.onpointercancel=endPtr;
const CURVED=['arrow','pass','shot','dribble'];
let animOn=false,lastT=-1,tt;
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,5000)}
$('anim').onclick=e=>{animOn=!animOn;e.currentTarget.classList.toggle('on',animOn);toast(animOn?'Suivi activé : tracez la flèche au départ, avancez la vidéo jusqu’à l’arrivée du joueur, puis touchez « Fin du suivi ».':'Suivi désactivé : les flèches restent fixes.')};
$('endf').onclick=()=>{let q=null;for(let i=shapes.length-1;i>=0;i--)if(shapes[i].anim){q=shapes[i];break}
 if(!q){toast('Aucune flèche avec suivi à régler.');return}
 if(v.currentTime<=q.t0+.05){toast('Avancez d’abord la vidéo jusqu’à l’arrivée du joueur.');return}
 q.t1=v.currentTime;draw();toast('Suivi réglé : '+(q.t1-q.t0).toFixed(1)+' s')};
function animGeom(s){if(!s.anim)return{a:s.a,c:s.c,b:s.b};const t=v.currentTime,t0=s.t0,t1=s.t1||t0+2;
 if(t<t0-.04||t>=t1)return null;const p=Math.max(0,(t-t0)/(t1-t0)),u=1-p;
 return{a:{x:u*u*s.a.x+2*u*p*s.c.x+p*p*s.b.x,y:u*u*s.a.y+2*u*p*s.c.y+p*p*s.b.y},c:{x:s.c.x+(s.b.x-s.c.x)*p,y:s.c.y+(s.b.y-s.c.y)*p},b:s.b}}
function fitCurve(s){const P=s.pts,a=P[0],b=P[P.length-1];let L=0;const cum=[0];for(let i=1;i<P.length;i++){L+=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);cum.push(L)}
 let m=a;for(let i=1;i<P.length;i++)if(cum[i]>=L/2){const t=(L/2-cum[i-1])/((cum[i]-cum[i-1])||1);m={x:P[i-1].x+(P[i].x-P[i-1].x)*t,y:P[i-1].y+(P[i].y-P[i-1].y)*t};break}
 const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
 const dev=len>1?Math.abs((m.x-a.x)*dy-(m.y-a.y)*dx)/len:0;
 s.b=b;s.c=(dev<Math.max(.07*len,8/sc))?mid:{x:2*m.x-mid.x,y:2*m.y-mid.y}}
function curved(s){const G=animGeom(s);if(!G)return;
 const bz=t=>{const u=1-t;return{x:u*u*G.a.x+2*u*t*G.c.x+t*t*G.b.x,y:u*u*G.a.y+2*u*t*G.c.y+t*t*G.b.y}};
 const P=[];for(let i=0;i<=120;i++)P.push(bz(i/120));
 const cum=[0];for(let i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
 const tot=cum[cum.length-1],shot=s.t==='shot',dr=s.t==='dribble',off=s.w*1.15,h=Math.min(s.w*(shot?7:dr?6:5),tot*.9);
 const at=d=>{d=Math.max(0,Math.min(tot,d));let i=1;while(i<cum.length-1&&cum[i]<d)i++;const t=(d-cum[i-1])/((cum[i]-cum[i-1])||1),p=P[i-1],q=P[i],l=Math.hypot(q.x-p.x,q.y-p.y)||1;return{x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,nx:-(q.y-p.y)/l,ny:(q.x-p.x)/l}};
 const sb=tot-h,base=at(sb);x.lineWidth=shot?s.w*.8:s.w;
 if(dr){const amp=s.w*1.7,step=s.w*3,V=[];for(let k=0;;k++){const d=sb-k*step;if(d<=0)break;const p=at(d),sg=k?(k%2?1:-1):0;V.push({x:p.x+p.nx*amp*sg,y:p.y+p.ny*amp*sg})}
  V.push(at(0));V.reverse();x.beginPath();V.forEach((p,k)=>k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}
 else{const Q=[];for(let i=0;i<P.length;i++)if(cum[i]<sb)Q.push(P[i]);Q.push(base);
  if(shot){for(const sg of[-1,1]){x.beginPath();Q.forEach((p,k)=>{const n=Q[Math.min(k+1,Q.length-1)],o=Q[Math.max(k-1,0)],tx=n.x-o.x,ty=n.y-o.y,l=Math.hypot(tx,ty)||1,px=p.x-ty/l*off*sg,py=p.y+tx/l*off*sg;k?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}}
  else{if(s.t==='pass')x.setLineDash([s.w*2.4,s.w*2]);x.beginPath();Q.forEach((p,k)=>k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();x.setLineDash([])}}
 const dx=G.b.x-base.x,dy=G.b.y-base.y,l=Math.hypot(dx,dy)||1,hw=shot?Math.max(off*2.8,h*.42):h*.5,nx=-dy/l*hw,ny=dx/l*hw;
 x.beginPath();x.moveTo(G.b.x,G.b.y);x.lineTo(base.x+nx,base.y+ny);x.lineTo(base.x-nx,base.y-ny);x.closePath();x.fill()}
function paint(s){x.lineCap=x.lineJoin='round';x.strokeStyle=x.fillStyle=s.c;x.lineWidth=s.w;x.setLineDash([]);x.beginPath();
 switch(s.t){
 case'pen':s.pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();break;
 case'line':x.moveTo(s.a.x,s.a.y);x.lineTo(s.b.x,s.b.y);x.stroke();break;
 case'arrow':case'pass':case'shot':case'dribble':curved(s);break;
 case'circle':x.arc(s.a.x,s.a.y,Math.hypot(s.b.x-s.a.x,s.b.y-s.a.y),0,7);x.stroke();break;
 case'rect':x.strokeRect(s.a.x,s.a.y,s.b.x-s.a.x,s.b.y-s.a.y);break;
 case'zone':x.strokeStyle='#fff';x.setLineDash([s.w*3,s.w*2]);x.lineWidth=2/sc;x.strokeRect(s.a.x,s.a.y,s.b.x-s.a.x,s.b.y-s.a.y);break;
 case'pawn':x.fillStyle=s.k==='A'?'#2f7bff':'#15181d';x.arc(s.a.x,s.a.y,s.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=s.r*.12;x.stroke();
  x.fillStyle='#fff';x.font=`700 ${s.r*1.1}px system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(s.n,s.a.x,s.a.y+s.r*.04);break;
 case'text':x.font=`700 ${s.w}px system-ui,sans-serif`;x.textAlign='left';x.textBaseline='middle';x.lineWidth=s.w/6;x.strokeStyle='#000';x.strokeText(s.s,s.a.x,s.a.y);x.fillText(s.s,s.a.x,s.a.y)}}
function draw(){x.clearRect(0,0,c.width,c.height);shapes.forEach(paint);if(cur)paint(cur)}
$('snap').onclick=()=>{if(!vw)return;const r=vp.getBoundingClientRect();
 const x0=Math.max(0,-tx/sc),y0=Math.max(0,-ty/sc),x1=Math.min(vw,(r.width-tx)/sc),y1=Math.min(vh,(r.height-ty)/sc),w=x1-x0,h=y1-y0;
 const o=document.createElement('canvas');o.width=Math.round(w);o.height=Math.round(h);const g=o.getContext('2d');
 g.drawImage(v,x0,y0,w,h,0,0,o.width,o.height);if(showDraw)g.drawImage(c,x0,y0,w,h,0,0,o.width,o.height);
 o.toBlob(async b=>{const name='coachboard_'+Math.round(v.currentTime*10)/10+'s.png',f=new File([b],name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Coachboard'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()},'image/png')};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
